<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>User Profile</h3>

        </div>

        <div class="card-body">

            <form th:action="@{/profile}"
                  th:object="${profile}"
                  method="post">

                <div class="mb-3">

                    <label>Education</label>

                    <input class="form-control"
                           type="text"
                           th:field="*{education}">

                </div>

                <div class="mb-3">

                    <label>Location</label>

                    <input class="form-control"
                           type="text"
                           th:field="*{location}">

                </div>

                <div class="mb-3">

                    <label>Experience</label>

                    <input class="form-control"
                           type="number"
                           th:field="*{experience}">

                </div>

                <div class="mb-3">

                    <label>Career Interest</label>

                    <input class="form-control"
                           type="text"
                           th:field="*{careerInterest}">

                </div>

                <button class="btn btn-primary">

                    Save Profile

                </button>

                <div class="mt-3 text-success"
                     th:text="${message}">
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
