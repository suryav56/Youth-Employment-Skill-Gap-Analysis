<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Register</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">

                    <h3>Create Account</h3>

                </div>

                <div class="card-body">

                    <form
                            th:action="@{/register}"
                            method="post"
                            th:object="${user}">

                        <div class="mb-3">

                            <label>Name</label>

                            <input
                                    class="form-control"
                                    type="text"
                                    th:field="*{name}"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label>Email</label>

                            <input
                                    class="form-control"
                                    type="email"
                                    th:field="*{email}"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label>Password</label>

                            <input
                                    class="form-control"
                                    type="password"
                                    th:field="*{password}"
                                    required>

                        </div>

                        <button
                                class="btn btn-success w-100">

                            Register

                        </button>

                    </form>

                    <div
                            class="mt-3 text-success text-center"
                            th:text="${message}"></div>

                    <hr>

                    <p class="text-center">

                        Already have an account?

                        <a th:href="@{/login}">

                            Login

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
