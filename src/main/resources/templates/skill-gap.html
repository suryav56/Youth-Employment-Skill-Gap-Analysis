<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Skill Gap Analysis</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>
                Skill Gap Analysis -
                <span th:text="${career.title}"></span>
            </h3>

        </div>

        <div class="card-body">

            <div class="row">

                <!-- User Skills -->
                <div class="col-md-6">

                    <h4 class="text-success">
                        Matching Skills
                    </h4>

                    <ul class="list-group">

                        <li class="list-group-item"
                            th:each="skill : ${matchedSkills}"
                            th:text="${skill.name}">
                        </li>

                    </ul>

                    <hr class="my-4">

                    <h4 class="text-primary">
                        Recommended Training Courses
                    </h4>

                    <div th:if="${recommendedCourses.isEmpty()}">
                        <p class="text-muted">
                            No training recommendations available.
                        </p>
                    </div>

                    <div class="row"
                         th:if="${!recommendedCourses.isEmpty()}">

                        <div class="col-md-6 mb-3"
                             th:each="course : ${recommendedCourses}">

                            <div class="card shadow-sm h-100">

                                <div class="card-body">

                                    <h5 class="card-title"
                                        th:text="${course.title}">
                                    </h5>

                                    <p class="card-text"
                                       th:text="${course.description}">
                                    </p>

                                    <p class="mb-1">
                                        <strong>Provider:</strong>
                                        <span th:text="${course.provider}"></span>
                                    </p>

                                    <p class="mb-0">
                                        <strong>Duration:</strong>
                                        <span th:text="${course.duration}"></span>
                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- Missing Skills -->
                <div class="col-md-6">

                    <h4 class="text-danger">
                        Missing Skills
                    </h4>

                    <ul class="list-group">

                        <li class="list-group-item"
                            th:each="skill : ${missingSkills}"
                            th:text="${skill.skill.name}">
                        </li>

                    </ul>

                </div>

            </div>

            <div class="mt-4 text-center">

                <a th:href="@{/careers}"
                   class="btn btn-secondary">
                    Back to Careers
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
