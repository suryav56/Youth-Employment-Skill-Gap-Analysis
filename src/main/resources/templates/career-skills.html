<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Assign Skills</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>
                Assign Skills to
                <span th:text="${career.title}"></span>
            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/careers/{id}/skills(id=${career.id})}"
                  method="post">

                <div class="form-check mb-2"
                     th:each="skill : ${skills}">

                    <input class="form-check-input"
                           type="checkbox"
                           name="skillIds"
                           th:value="${skill.id}"
                           th:checked="${career.requiredSkills.contains(skill)}">

                    <label class="form-check-label"
                           th:text="${skill.name}"></label>

                </div>

                <br>

                <button class="btn btn-success">
                    Save Skills
                </button>

                <a th:href="@{/careers}"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
