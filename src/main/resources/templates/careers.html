<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Career Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Career Management</h3>

        </div>

        <div class="card-body">

            <form th:action="@{/careers}"
                  th:object="${career}"
                  method="post">

                <div class="mb-3">

                    <label>Career Title</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{title}"
                           required>

                </div>

                <div class="mb-3">

                    <label>Description</label>

                    <textarea class="form-control"
                              rows="3"
                              th:field="*{description}">
                    </textarea>

                </div>

                <button class="btn btn-primary">
                    Save Career
                </button>

            </form>

            <hr>

            <table class="table table-bordered">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Career</th>
                    <th>Description</th>
                    <th>Assign Skills</th>
                    <th>Analyze</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="career : ${careers}">

                    <td th:text="${career.id}"></td>

                    <td th:text="${career.title}"></td>

                    <td th:text="${career.description}"></td>

                    <td>
                        <a th:href="@{/careers/{id}/skills(id=${career.id})}"
                           class="btn btn-success btn-sm">
                            Assign Skills
                        </a>
                    </td>

                    <td>
                        <a th:href="@{/skill-gap/{id}(id=${career.id})}"
                           class="btn btn-primary btn-sm">
                            Analyze
                        </a>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
